<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Area in Sviluppo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #15202b 0%, #050a10 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 200, 0.2);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 85%;
            width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 255, 200, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: appari 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .icon-container {
            position: relative;
            width: 90px;
            height: 90px;
            margin: 0 auto 25px auto;
        }

        .icon {
            font-size: 75px;
            line-height: 90px;
            animation: pulsazione 2.5s infinite ease-in-out;
        }

        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: #00ffcc;
            border-radius: 50%;
            filter: blur(35px);
            opacity: 0.3;
            z-index: -1;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 12px 0;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 30%, #00ffcc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 0.95rem;
            color: #8fa0b0;
            line-height: 1.6;
            margin: 0 0 30px 0;
        }

        .badge {
            display: inline-block;
            background: rgba(0, 255, 200, 0.1);
            border: 1px solid rgba(0, 255, 200, 0.3);
            color: #00ffcc;
            padding: 6px 14px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: linear-gradient(135deg, #00ffcc 0%, #00b3ff 100%);
            color: #050a10;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 255, 200, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-back:active {
            transform: scale(0.97);
            box-shadow: 0 4px 10px rgba(0, 255, 200, 0.1);
        }

        @keyframes appari {
            0% { opacity: 0; transform: translateY(30px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes pulsazione {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(3deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">In Arrivo</div>
        
        <div class="icon-container">
            <div class="glow"></div>
            <div class="icon">🛠️</div>
        </div>
        
        <h1>Lavori in Corso</h1>
        <p>Questa modalità di gioco è attualmente in fase di sviluppo. Stiamo preparando un'esperienza straordinaria, torna a trovarci presto!</p>
        
        <a href="javascript:history.back()" class="btn-back">
            <span>←</span> Torna Indietro
        </a>
    </div>

</body>
</html>```
